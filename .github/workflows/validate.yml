on: [pull_request]

jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Install Prerequisites
      run: ./build/vsts-prerequisites.ps1
      shell: pwsh
    - name: Validate
      run: ./build/vsts-validate.ps1
      shell: pwsh
